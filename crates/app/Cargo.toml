[package]
name = "raptaboard"
description = "raptaboard: an FRC driver dashboard with WASM widget plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# `cargo run -p raptaboard` runs the dashboard; `--bin raptaboard-cli` the
# console program for its commands (src/bin/raptaboard-cli.rs).
default-run = "raptaboard"

[dependencies]
eframe = "0.37.0"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
raptaboard-layout.workspace = true
raptaboard-plugin-host.workspace = true
nt4.workspace = true
# select! and timers for the robot state sound task (nt4 already builds them).
tokio = { workspace = true, features = ["macros", "time"] }
rfd = "0.17.2"
clap = { version = "4.6.8", features = ["derive"] }
egui_plot = "0.38.0"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# SVG images (built-in icons and imported .svg files); no text, so no fonts.
resvg = { version = "0.49.0", default-features = false }
# Content packs (`content.rs`): HTTPS downloads (rustls, the system's
# certificates so school and team networks' own work), the catalog's
# signature and each file's checksum.
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = "0.11.1"

[lints]
workspace = true

# A Windows release build joins the terminal it was started from to print
# (`raptaboard packs …`): the one unsafe call, in a crate of its own.
[target.'cfg(windows)'.dependencies]
raptaboard-win-console.workspace = true

# Puts the icon into the Windows program (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
# The README's clips (`ui/tests/clips.rs`) are saved as GIFs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
nt4 = { workspace = true, features = ["server"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
# The system's fonts for symbols egui lacks (⚙, the bell), as eframe loads them,
# for the Store screenshots (`ui/tests/clips.rs`).
egui_system_font_provider = "0.37.0"
