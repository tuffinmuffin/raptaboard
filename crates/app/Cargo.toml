[package]
name = "raptaboard"
description = "raptaboard: an FRC driver dashboard with WASM widget plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
eframe = "0.37.0"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
raptaboard-layout.workspace = true
raptaboard-plugin-host.workspace = true
nt4.workspace = true
tokio.workspace = true
rfd = "0.17.2"
clap = { version = "4.6.8", features = ["derive"] }
egui_plot = "0.38.0"

[lints]
workspace = true

[dev-dependencies]
nt4 = { workspace = true, features = ["server"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
