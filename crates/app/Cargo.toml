[package]
name = "raptaboard"
description = "raptaboard: an FRC driver dashboard with WASM widget plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
eframe = "0.37.0"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
raptaboard-layout.workspace = true
raptaboard-plugin-host.workspace = true
nt4.workspace = true
tokio.workspace = true
rfd = "0.17.2"
clap = { version = "4.6.8", features = ["derive"] }
egui_plot = "0.38.0"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# SVG images (built-in icons and imported .svg files); no text, so no fonts.
resvg = { version = "0.49.0", default-features = false }

[lints]
workspace = true

# Puts the icon into the Windows program (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
# The README's clips (`ui/tests/clips.rs`) are saved as GIFs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
nt4 = { workspace = true, features = ["server"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
