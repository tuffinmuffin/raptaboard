# A topic plugin for raptaboard's own tests (the published examples are in
# raptaboard-examples): a number topic as text, with its unit.
name = "topic-test"
version = "0.1.0"
api = "0.3"

[match]
topic_types = ["double", "float", "int"]

[size]
default = [1, 1]
min = [1, 1]

[properties]
# -1: up to 4 places, trailing zeros dropped.
decimal_places = { type = "number", default = -1 }
font_size = { type = "number", default = 14 }
fit_text = { type = "bool", default = false }

[sandbox]
value = 1.23456
