name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The plugins and their SDK: a workspace of their own, built for
      # WebAssembly (plugin-host's tests build them too).
      - name: Plugins
        working-directory: plugins
        run: |
          cargo fmt --all --check
          cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      - run: cargo test --workspace
      # Code only a Windows release build has (main.rs's
      # `all(windows, not(debug_assertions))`: joining the terminal for
      # `raptaboard packs`) isn't in the debug build tested above; check it
      # here rather than finding out in the Release workflow.
      - name: Windows release-only code
        if: runner.os == 'Windows'
        run: cargo clippy --release -p raptaboard --bin raptaboard -- -D warnings

  # Test coverage (cargo-llvm-cov) of every workspace crate. The report goes
  # in the job summary; on a PR it also shows the change from the base
  # branch, and goes in one PR comment that each push updates. The HTML
  # report is uploaded as an artifact. Same setup as nt4-rs.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      COV_ARGS: --workspace --ignore-filename-regex (tests|examples|benches)/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      - name: Measure this commit
        run: |
          cargo llvm-cov $COV_ARGS --json --summary-only --output-path coverage.json
          cargo llvm-cov report --html --ignore-filename-regex '(tests|examples|benches)/'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add -q ../base "${{ github.event.pull_request.base.sha }}"
          (cd ../base && cargo llvm-cov $COV_ARGS --json --summary-only \
              --output-path "$GITHUB_WORKSPACE/base.json") \
            || echo "::warning::Could not measure the base branch; the report has no comparison."
      # The comment is edited in place, and GitHub shows when it was first
      # posted; the report says which commit it measured and when.
      - name: Write the report
        env:
          COV_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          COV_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COV_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/coverage_summary.py coverage.json base.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      # Fork PRs get a read-only token, so they only have the job summary.
      - name: Post or update the PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- raptaboard-coverage -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@coverage.md > /dev/null
          else
            gh pr comment "$PR" --body-file coverage.md
          fi
