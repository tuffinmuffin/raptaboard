[workspace]
resolver = "3"
members = ["crates/nt4", "crates/layout", "crates/plugin-host", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tuffinmuffin/raptaboard"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.8"
rmpv = "1"
glob = "0.3"
raptaboard-nt4 = { path = "crates/nt4" }
raptaboard-layout = { path = "crates/layout" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
