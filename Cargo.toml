[workspace]
resolver = "3"
members = ["crates/layout", "crates/plugin-host", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tuffinmuffin/raptaboard"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.8"
glob = "0.3"
nt4 = "0.3"
tokio = { version = "1.47", features = ["rt-multi-thread"] }
raptaboard-layout = { path = "crates/layout" }
raptaboard-plugin-host = { path = "crates/plugin-host" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds (`cargo build --release`): smaller and faster, slower to
# build. Day-to-day work uses debug builds, which this doesn't change.
# Debug info goes to a file beside the program instead of inside it
# (macOS: raptaboard.dSYM, Windows: raptaboard.pdb, Linux: raptaboard.dwp),
# so a crash dump can still be decoded with function names and line
# numbers; keep that file with each build that's handed out.
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

# Debug builds: decode field images with the image crates optimized, so a
# field's picture shows in a moment instead of seconds (and tests that draw
# a Field don't load the machine). Only these crates; the rest stay debug.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
